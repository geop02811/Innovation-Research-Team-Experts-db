services:
  postgres:
    image: postgres:18
    container_name: expertdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expert_db}
      POSTGRES_USER: ${POSTGRES_USER:-expert_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - expertdb_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/expertDB
    container_name: expertdb-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-expert_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-expert_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-false}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:3000,http://127.0.0.1:3000}
      APP_SIGNUP_ALLOWED_EMAIL_DOMAINS: ${APP_SIGNUP_ALLOWED_EMAIL_DOMAINS:-uz.ac.zw}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_SIGNUP_MAIL_FROM: ${APP_SIGNUP_MAIL_FROM:-}
      APP_PASSWORD_RESET_MAIL_FROM: ${APP_PASSWORD_RESET_MAIL_FROM:-}
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    container_name: expertdb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PRIVATE_API_BASE_URL: http://backend:8080
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${PUBLIC_APP_ORIGIN:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  db-backup:
    image: postgres:18
    container_name: expertdb-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-expert_db}
      PGUSER: ${POSTGRES_USER:-expert_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    # A host folder rather than a volume, so no compose command can remove the dumps.
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          file="/backups/$${PGDATABASE}-$$(date +%Y-%m-%d_%H%M).dump"
          if pg_dump -Fc -f "$$file.partial"; then
            mv "$$file.partial" "$$file"
            echo "Backup written to $$file"
            find /backups -name '*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          else
            rm -f "$$file.partial"
            echo "Backup failed" >&2
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done

volumes:
  # External so `docker compose down -v` can never delete the database.
  # Create it once with: docker volume create <name>
  expertdb_data:
    external: true
    name: ${POSTGRES_VOLUME:-innovation-research-team-experts-db_expertdb_data}
