spring.application.name=expertDB
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expert_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:olivermazorodze}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:3000,http://10.*:5173,http://10.*:5174,http://192.168.*:5173,http://192.168.*:5174,http://172.*:5173,http://172.*:5174}
app.password-reset.otp-expiration-minutes=${APP_PASSWORD_RESET_OTP_EXPIRATION_MINUTES:10}
app.password-reset.mail-from=${APP_PASSWORD_RESET_MAIL_FROM:no-reply@localhost}

app.signup.allowed-email-domains=${APP_SIGNUP_ALLOWED_EMAIL_DOMAINS:uz.ac.zw}
app.signup.otp-expiration-minutes=${APP_SIGNUP_OTP_EXPIRATION_MINUTES:10}
app.signup.mail-from=${APP_SIGNUP_MAIL_FROM:no-reply@localhost}

# Mail sender is only auto-configured when SMTP_HOST is set; leave unset locally to keep
# OTP delivery falling back to server-log output instead of attempting a real SMTP connection.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# spring.jpa.hibernate.ddl-auto=none
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# Allow large JSON payloads for profile photo data URLs
server.tomcat.max-http-post-size=20MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB