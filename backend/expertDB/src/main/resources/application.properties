spring.application.name=expertDB
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expert_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:olivermazorodze}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:3000,http://10.*:5173,http://10.*:5174,http://192.168.*:5173,http://192.168.*:5174,http://172.*:5173,http://172.*:5174}

# spring.jpa.hibernate.ddl-auto=none
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# Allow large JSON payloads for profile photo data URLs
server.tomcat.max-http-post-size=20MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB